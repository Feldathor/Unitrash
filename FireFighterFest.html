<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireFighter Fest - KAPELA UNITRASH</title>
<link rel="shortcut icon" href="images/logo.jpg">
<link href="https://fonts.googleapis.com/css?family=PT+Serif:400,700" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#efefef;font:16px/1.6 "PT Serif",sans-serif}
.container{max-width:1170px;margin:0 auto;padding:0 15px}
section.t{padding:50px 0}section.g{padding:100px 0}
h1{font-weight:400;font-size:36px;line-height:1.1;margin:20px 0 10px;text-align:center}
h1.ttl{font-size:60px;color:#b8312f}
h1.ttl.sp{margin-bottom:60px}
p{margin:0 0 10px}p.c{text-align:center}p.lead{font-size:21px;font-weight:300;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;margin:0 -15px}
.col{flex:0 0 33.333%;max-width:33.333%;padding:0 15px}
.th{display:block;margin-bottom:10px}
.th img{display:block;width:100%;height:auto;padding:4px;background:#fff;border:1px solid #ddd;border-radius:4px}
.th:hover img{opacity:.85}
.back{position:absolute;top:20px;left:20px;color:#efefef;font-size:15px;text-decoration:none;opacity:.7}
.back:hover{opacity:1;text-decoration:underline}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:90vw;max-height:88vh;display:block}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:44px;line-height:1;cursor:pointer;padding:12px 18px}
.lb .x{top:6px;right:8px}.lb .p{left:4px;top:50%}.lb .n{right:4px;top:50%}
@media(max-width:767px){.col{flex:0 0 100%;max-width:100%}h1.ttl{font-size:44px}}
</style>
</head>
<body>
<a class="back" href="Galerie.html">Zpět do galerie</a>
<section class="t"><div class="container">
<h1 class="ttl">FireFighter Fest</h1>
</div></section>
<section class="t"><div class="container">
<h1>2023</h1>
<p class="c">Náš první ročník tohohle skvělýho fesrtivalu. Užili jsme si to a máme za to, že lidi taky!</p>
</div></section>
<section class="g"><div class="container">
<div class="row">
<div class="col"><a class="th" href="images/firefighter-01.png" data-lb><img src="images/firefighter-01.png" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-02.jpg" data-lb><img src="images/firefighter-02.jpg" alt="image" loading="lazy"></a></div>
<div class="col"><a class="th" href="images/firefighter-03.png" data-lb><img src="images/firefighter-03.png" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-04.jpg" data-lb><img src="images/firefighter-04.jpg" alt="image" loading="lazy"></a></div>
<div class="col"><a class="th" href="images/firefighter-05.png" data-lb><img src="images/firefighter-05.png" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-06.jpg" data-lb><img src="images/firefighter-06.jpg" alt="image" loading="lazy"></a></div>
</div>
</div></section>
<section class="t"><div class="container">
<h1>2024</h1>
<p class="c">Překvapení v podobě neavizované kapely. Pořád nás to baví!</p>
</div></section>
<section class="g"><div class="container">
<div class="row">
<div class="col"><a class="th" href="images/firefighter-07.jpg" data-lb><img src="images/firefighter-07.jpg" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-08.jpg" data-lb><img src="images/firefighter-08.jpg" alt="image" loading="lazy"></a></div>
<div class="col"><a class="th" href="images/firefighter-09.jpg" data-lb><img src="images/firefighter-09.jpg" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-10.jpg" data-lb><img src="images/firefighter-10.jpg" alt="image" loading="lazy"></a></div>
<div class="col"><a class="th" href="images/firefighter-11.jpg" data-lb><img src="images/firefighter-11.jpg" alt="image" loading="lazy"></a><a class="th" href="images/firefighter-12.jpg" data-lb><img src="images/firefighter-12.jpg" alt="image" loading="lazy"></a></div>
</div>
</div></section>
<script>
(function(){
var links=[].slice.call(document.querySelectorAll('a[data-lb]'));if(!links.length)return;
var lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');
lb.innerHTML='<button class="x" aria-label="Zavřít">&times;</button><button class="p" aria-label="Předchozí">&lsaquo;</button><img alt=""><button class="n" aria-label="Další">&rsaquo;</button>';
document.body.appendChild(lb);
var img=lb.querySelector('img'),i=0,last=null;
function show(k){i=(k+links.length)%links.length;img.src=links[i].href}
function open(k){last=document.activeElement;show(k);lb.classList.add('on');lb.querySelector('.x').focus()}
function close(){lb.classList.remove('on');img.removeAttribute('src');if(last)last.focus()}
links.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();open(k)})});
lb.addEventListener('click',function(e){if(e.target===lb)close()});
lb.querySelector('.x').onclick=close;lb.querySelector('.p').onclick=function(){show(i-1)};lb.querySelector('.n').onclick=function(){show(i+1)};
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='ArrowRight')show(i+1)});
})();
</script>
</body>
</html>
